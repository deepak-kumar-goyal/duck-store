spring.application.name=duckstore

# Defaults match the MySQL service in the root docker-compose.yml; override with env vars.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/duckstore}
spring.datasource.username=${DB_USER:duckuser}
spring.datasource.password=${DB_PASSWORD:duckpassword}

# The schema is owned by Flyway; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---- Pricing rules (values from the requirements; see the rule classes in domain/pricing) ----
# Percentages are whole numbers. A negative percentage is a discount. Money is in USD.

# More than <threshold> units get <percent>% off the total cost (quantity x price).
pricing.volume-discount.threshold=100
pricing.volume-discount.percent=20

# Added to (or, when negative, taken off) the subtotal, per package type.
pricing.package-percent.wood=5
pricing.package-percent.plastic=10
pricing.package-percent.cardboard=-1

# Added to the subtotal per destination country (lower case here, matched ignoring case); other countries get
# the default.
pricing.destination.default-percent=15
pricing.destination.percent.usa=18
pricing.destination.percent.bolivia=13
pricing.destination.percent.india=19

# Sea: flat fee. Land: fee per unit. Air: fee per unit, reduced by <air-bulk-reduction-percent>% when the order
# exceeds <air-bulk-threshold> units.
pricing.shipping.sea-flat-fee=400
pricing.shipping.land-per-unit=10
pricing.shipping.air-per-unit=30
pricing.shipping.air-bulk-threshold=1000
pricing.shipping.air-bulk-reduction-percent=15
